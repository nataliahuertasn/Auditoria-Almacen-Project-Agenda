<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Room Audit</title>
<!--
  MAQUETA INTERACTIVA — Auditoría de almacén en Project Agenda
  Modificación de códigos, reporte de códigos en Excel y SAP Movement en Bill of Materials.

  Prototipo 100% front-end: no hay backend, base de datos ni conexión con SAP.
  Todos los datos y personas son ficticios y se reinician al recargar la página.

  Decisiones tomadas donde el requerimiento es ambiguo (buscar "DECISIÓN" en el código):
    D1  CODE REQUEST lista todos los códigos. Las pestañas Approved / On Hold / Rejected parecen ser de
        reservas (la ruta real es /stock-room/reserves-rejected), por eso no se incluyen.
    D2  Request Modification solo aparece en códigos que ya tienen código SAP.
    D3  Un código con una solicitud pendiente no admite otra, pero se puede seguir usando.
    D4  Al completar o rechazar una solicitud, el código vuelve al estado que tenía antes.
    D5  Cualquier usuario puede solicitar; solo el rol Stockroom edita o rechaza (selector "Viewing as").
    D6  Se agrega el estado Rejected, con motivo, para cerrar solicitudes erradas.
    D7  Los BOM existentes conservan sus valores: editar un código no los modifica.
    D8  Reporte de una sola hoja: consolidado arriba y detalle debajo, con una fila por solicitud. Muestra las solicitudes
        recibidas en el periodo y las anteriores que tuvieron una modificación en el periodo.
    D9  SAP Movement solo admite dígitos, se guarda como texto y es obligatorio para marcar el check de SAP.
        Las entregas antiguas quedan vacías y se pueden completar, incluso en BOM cerrados.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Saira+Semi+Condensed:wght@600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{
  color-scheme:light;
  --primary:#1976d2; --primary-d:#115ea8; --primary-l:#e3eefa;
  --bg:#f7f7f7; --panel:#fff; --rail:#f1f1f1; --head:#eeeeee; --line:#e0e0e0;
  --text:#212121; --muted:#616161; --muted2:#9e9e9e;
  --danger:#e53935; --danger-l:#fdecea; --ok:#2e7d32; --ok-l:#e8f5e9; --warn:#b25e00; --warn-l:#fff4e5;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 Roboto,system-ui,"Segoe UI",Arial,sans-serif}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;fill:currentColor;flex:none;vertical-align:middle}
.app{display:flex;flex-direction:column;min-height:100vh}

/* Header */
header.top{display:flex;align-items:center;gap:16px;padding:8px 20px;background:#fafafa}
.top .sp{flex:1}
.viewas{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);white-space:nowrap}
.viewas select{border:1px solid #bdbdbd;border-radius:4px;padding:5px 6px;background:#fff;font-size:13px;max-width:230px}
.iconbtn{background:none;border:0;padding:6px;border-radius:50%;color:#555;position:relative;display:inline-flex}
.iconbtn:hover{background:#0000000d}
.iconbtn:focus-visible,.btn:focus-visible,.tab:focus-visible,.pill:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.iconbtn svg.i{width:30px;height:30px}
.badge{position:absolute;top:-2px;right:-4px;background:var(--danger);color:#fff;font-size:11px;border-radius:10px;padding:0 6px;line-height:18px;font-weight:500}

/* Layout */
.body{flex:1;display:flex;min-width:0}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.tabs{display:flex;background:var(--head);overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:18px 20px;font:600 15px 'Open Sans',Roboto,sans-serif;letter-spacing:1.1px;color:#6a6a6a;text-transform:uppercase;white-space:nowrap;display:flex;align-items:center;gap:8px}
.tab:hover{background:#e4e4e4}
.tab.on{background:#fff;color:var(--primary)}
.tab .count{background:var(--danger);color:#fff;border-radius:10px;font-size:11px;line-height:18px;min-width:18px;padding:0 5px;letter-spacing:0;text-align:center}
.page{flex:1;padding:20px;background:#fff;min-width:0}
footer{display:flex;justify-content:flex-end;padding:10px 20px;background:#fafafa;font-size:14px}

/* Toolbar y tablas */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;min-height:36px}
.bar .sp{flex:1}
.bar h2{margin:0;font-size:18px;font-weight:500}
.card{border:1px solid var(--line);border-radius:6px;background:#fff}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse}
table.t th{background:var(--head);color:#555;font-size:13px;font-weight:700;letter-spacing:.2px;text-transform:uppercase;padding:18px 14px;text-align:left;white-space:nowrap;position:relative}
table.t td{padding:13px 14px;border-top:1px solid var(--line);vertical-align:middle;font-size:14px}
table.t tr.link{cursor:pointer}
table.t tr.link:hover td{background:#f5f9fd}
table.t .c{text-align:center}
table.t .r{text-align:right}
.nodata{text-align:center;color:var(--muted2);padding:18px!important}
.w-code{white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:12px}
.thbtn{border:0;background:none;padding:2px 4px;color:inherit;font:inherit;text-transform:inherit;display:inline-flex;align-items:center;gap:6px}
.thbtn svg.i{width:16px;height:16px;transition:transform .15s}
.thbtn.desc svg.i{transform:rotate(180deg)}
.menu{position:absolute;z-index:20;top:44px;left:8px;background:#fff;border-radius:4px;box-shadow:0 6px 20px #0003;padding:6px 0;min-width:210px;text-transform:none;letter-spacing:0}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 14px;font-size:14px;font-weight:400;color:var(--text)}
.menu button:hover{background:#f1f1f1}
.menu button.on{color:var(--primary);font-weight:500}

/* Botones y estados */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:20px;padding:8px 18px;font-weight:700;font-size:13px;letter-spacing:.4px;text-transform:uppercase;background:var(--primary);color:#fff;white-space:nowrap}
.btn:hover{background:var(--primary-d)}
.btn svg.i{width:18px;height:18px}
.btn.line{background:#fff;color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.btn.line:hover{background:var(--primary-l)}
.btn.text{background:none;color:var(--muted)}
.btn.text:hover{background:#0000000a}
.btn.red{background:#fff;color:var(--danger);box-shadow:inset 0 0 0 1px var(--danger)}
.btn.red:hover{background:var(--danger-l)}
.btn.sm{padding:5px 12px;font-size:11.5px}
.btn:disabled{background:#e0e0e0;color:#8a8a8a;box-shadow:none;cursor:not-allowed}
.dotbtn{border:0;background:none;padding:4px;border-radius:50%;color:#555;display:inline-flex}
.dotbtn:hover{background:#0000000f;color:var(--primary)}
.dotbtn:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
.rowmenu{z-index:40;left:auto;min-width:190px}
.menu button:disabled{color:var(--muted2);background:none;cursor:not-allowed}
.st{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:500;white-space:nowrap;background:#eee;color:#555}
.st.Approved,.st.Completed{background:var(--ok-l);color:var(--ok)}
.st.Pending{background:var(--warn-l);color:var(--warn)}
.st.Sent,.st.Requested,.st.SAP{background:var(--primary-l);color:var(--primary-d)}
.st.Delivered{background:var(--warn-l);color:var(--warn)}
.st.Rejected{background:var(--danger-l);color:#b71c1c}
.st.ModificationRequested{background:var(--primary-l);color:var(--primary-d)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid #bdbdbd;background:#fff;color:var(--muted);border-radius:16px;padding:5px 14px;font-size:13px}
.pill.on{background:var(--primary);border-color:var(--primary);color:#fff}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-width:170px;max-width:280px}
.empty{color:var(--muted2);text-align:center;padding:70px 20px}

/* Modales */
.ov{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;overflow:auto;z-index:50}
.modal{background:#fff;border-radius:6px;width:min(560px,100%);box-shadow:0 8px 28px #0004}
.modal.wide{width:min(820px,100%)}
.pop{position:absolute;z-index:40;width:min(340px,calc(100vw - 32px));background:#fff;border-radius:6px;overflow:hidden;box-shadow:0 8px 28px #0004}
.calh{background:var(--primary);color:#fff;padding:14px 20px}
.calh span{display:block;font-size:15px;font-weight:500;opacity:.7}
.calh strong{display:block;font-size:32px;font-weight:500;line-height:1.2}
.caln{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px}
.caln b{font-size:15px;font-weight:700}
.caln button{border:0;background:none;width:32px;height:32px;border-radius:50%;font-size:24px;line-height:1;color:#555}
.caln button:hover{background:#0000000d}
.calw,.cald{display:grid;grid-template-columns:repeat(7,1fr);padding:0 12px;justify-items:center}
.calw{gap:2px}
.calw span{width:100%;background:var(--head);text-align:center;color:#757575;font-size:12px;font-weight:700;padding:7px 0}
.cald{gap:2px 0;padding-top:6px;padding-bottom:6px;min-height:232px;align-content:start}
.day{width:36px;height:36px;border:0;border-radius:50%;background:none;font-size:13px;font-weight:500;color:var(--text)}
.day:hover{background:var(--primary-l)}
.day.today{box-shadow:inset 0 0 0 1px var(--primary)}
.day.on{background:#4690dc;color:#fff}
.day:focus-visible,.caln button:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
.mh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 24px 10px}
.mh h3{margin:0;font-size:20px;font-weight:500}
.mb{padding:6px 24px 12px}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 24px 20px}
.info{background:#f5f5f5;border-radius:4px;padding:10px 14px;margin:0 0 16px;font-size:13px}
.info .l{color:var(--muted);font-weight:500}
.info div+div{margin-top:3px}
.fl{display:block;margin-bottom:16px}
.fl>span,.lg{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:4px}
.fl input,.fl textarea{width:100%;border:0;border-bottom:1px solid #9e9e9e;background:none;padding:5px 0 6px;outline:0;font-size:15px}
.fl textarea{resize:vertical;min-height:62px}
.fl input:focus,.fl textarea:focus{border-bottom:2px solid var(--primary)}
.fl.bad input,.fl.bad textarea{border-bottom:2px solid var(--danger)}
.err{color:#c62828;font-size:12px;margin-top:3px;min-height:0}
.req-star{color:var(--danger)}
input[type=checkbox]{accent-color:var(--primary);width:18px;height:18px;margin:0;cursor:pointer}
input[type=checkbox]:disabled{cursor:default;accent-color:#9e9e9e}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.grid2 .full{grid-column:1/-1}
.diffbox{border:1px solid var(--line);border-radius:4px;margin-top:2px}
.diffbox h4{margin:0;padding:9px 12px;font-size:13px;font-weight:700;background:var(--head);text-transform:uppercase;color:#555;border-radius:4px 4px 0 0}
table.d{width:100%;border-collapse:collapse;font-size:13px}
table.d th{text-align:left;padding:7px 12px;color:var(--muted);font-weight:500;font-size:12px}
table.d td{padding:7px 12px;border-top:1px solid var(--line);word-break:break-word}
table.d .old{color:#8a8a8a;text-decoration:line-through}
.diffbox .none{padding:10px 12px;color:var(--muted2);font-size:13px}
.warn{background:var(--warn-l);color:#7a4100;border-radius:4px;padding:8px 12px;font-size:13px;margin:12px 0 0}
.hitem{border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:12px}
.hitem .hh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.hitem .kv{font-size:13px;margin:2px 0}
.hitem .kv .l{color:var(--muted)}
.hitem .diffbox{margin-top:8px}

/* Detalle BOM */
.bomh{display:flex;align-items:center;gap:10px;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:16px}
.bomh h2{margin:0;font-size:20px;font-weight:400;line-height:1.3}
.bomh h2 b{font-weight:700}
.bomh .iconbtn{color:var(--primary)}
.bomh .iconbtn svg.i{width:24px;height:24px}
.bominfo{display:grid;grid-template-columns:1fr 1fr 110px;gap:8px 24px;margin-bottom:20px;color:var(--muted);font-size:13px}
.bominfo b{font-weight:700}
.bominfo p{margin:0 0 10px}
.bnotes{display:flex;gap:12px;align-items:flex-start;color:var(--text)}
.bnotes>div{flex:1;border-bottom:1px solid #9e9e9e;padding-bottom:6px;max-width:580px}
.qr{width:104px;height:104px;justify-self:end}
.items{background:var(--head);border-radius:6px;border:1px solid var(--line)}
.items h3{margin:0;padding:14px 20px 12px;font-size:15px;font-weight:700}
table.it{width:100%;border-collapse:collapse;min-width:960px}
table.it>thead th{font-size:12px;color:#555;text-transform:uppercase;padding:9px 10px;text-align:center;white-space:nowrap}
table.it>tbody>tr.row>td{background:#fff;padding:7px 10px;text-align:center;border-top:1px solid #ddd;font-size:13px}
table.it .desc{text-align:left}
table.it td.notes{font-size:13px;min-width:260px}
.dwrap{background:#fff;padding:10px 14px}
.dbox{background:#fff;border:1px solid #e9e9e9;border-radius:6px}
table.dv{width:100%;border-collapse:collapse;table-layout:fixed}
table.dv th{background:var(--head);font-size:12px;color:#555;text-transform:uppercase;padding:9px 8px;text-align:center}
table.dv td{padding:8px;text-align:center;border-top:1px solid #eee;font-size:13px;vertical-align:top;word-break:break-word}

.mov input{width:100%;max-width:150px;border:0;border-bottom:1px solid #9e9e9e;text-align:center;padding:2px;outline:0;background:none;font-size:13px}
.mov input:focus{border-bottom:2px solid var(--primary)}
.mov.bad input{border-bottom:2px solid var(--danger)}
.movv{display:inline-flex;align-items:center;gap:4px}
.movv button{border:0;background:none;color:var(--primary);padding:2px;display:inline-flex}
.movv button svg.i{width:15px;height:15px}
.tl{list-style:none;margin:0;padding:6px 4px 10px;position:relative}
.tl:before{content:"";position:absolute;left:14px;top:14px;bottom:30px;width:2px;background:#d6d6d6}
.tl li{position:relative;display:grid;grid-template-columns:30px 1fr auto;gap:0 16px;align-items:start;padding:12px 0}
.tl div b{display:block;font-weight:700;color:#555}
.tl div span{display:block;color:var(--muted)}
.tl small{display:block;color:var(--muted2);font-size:12px}
.tl time{color:var(--muted);white-space:nowrap}
.tdot{width:22px;height:22px;margin:0 4px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px #0005;position:relative;background:var(--primary)}
.tdot.Approved{background:#2eaf4f}
.tdot.Rejected{background:#e53935}
.tdot.Delivered{background:#fb8c00}
.tdot.SAP{background:#42a5f5}
.tdot.Modified{background:#8e24aa}
.tdot.InProgress{background:#757575}
.tdot.Requested{background:#00acc1}
.hintbar{background:var(--primary-l);color:#0c4a86;font-size:13px;border-radius:4px;padding:8px 12px;margin:0 0 14px}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 18px;border-radius:4px;box-shadow:0 4px 14px #0005;z-index:80;max-width:calc(100vw - 32px)}
.toast.bad{background:#b71c1c}

@media (max-width:900px){
  .bominfo{grid-template-columns:1fr}
  .qr{justify-self:start}
  .bomh h2{font-size:17px}
}
@media (max-width:640px){
  header.top{padding:8px 16px;flex-wrap:wrap;gap:8px}
  .viewas{order:3;width:100%}
  .viewas select{flex:1;max-width:none}
  .page{padding:16px}
  .tab{padding:14px 12px;font-size:13px}
  .grid2{grid-template-columns:1fr}
  .mh,.mb,.mf{padding-left:16px;padding-right:16px}
  .ov{padding:12px}
  .dwrap{padding:10px}
  table.dv{min-width:760px}
  .items h3{padding:16px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>

    ${dots('c:'+c.id,'Actions for '+esc(c.description))}</tr>`;
}
/* Acciones del menú ⋯. DECISIÓN D2 y D3: con una solicitud pendiente la opción queda deshabilitada */
function codeActions(c){
  const list=[{label:'View',act:'view',v:c.id}];
  if(c.status==='Pending') list.push({label:'Edit',act:'existing'},{label:'Delete',act:'existing'});
  /* La opción sale en todas las filas; solo se activa si el código existe y no tiene una solicitud pendiente */
  const blocked=!c.sapCode?'Available once the code is created':pendingOf(c.id)?'This code already has a pending modification request':'';
  list.push(blocked?{label:'Modification Requested',disabled:true,title:blocked}:{label:'Modification Requested',act:'request',v:c.id});
  if(reqsOf(c.id).length) list.push({label:'Modification History',act:'history',v:c.id});
  return list;
}
function modActions(r){
  const list=[{label:'View Details',act:'history',v:r.codeId,focus:r.id}];
  if(r.status==='Pending'){
    const ok=S.user.canEdit, title='Only the Stockroom role can edit or reject requests';
    list.unshift({label:'Edit Code',act:'edit',v:r.id,disabled:!ok,title},{label:'Reject',act:'reject',v:r.id,disabled:!ok,title});
  }
  return list;
}
function rowMenu(key,btn){
  const [type,id]=[key.slice(0,1),key.slice(2)];
  const items=type==='b'?[{label:'View',act:'bom',v:id},{label:'Timeline',act:'timeline',v:id}]:type==='c'?codeActions(codeOf(id)):modActions(reqOf(id));
  const b=btn.getBoundingClientRect();
  const top=b.bottom+window.scrollY+4, right=document.documentElement.clientWidth-b.right;
  $('#modal').innerHTML=`<div class="menu rowmenu" role="menu" data-for="${key}" style="top:${top}px;right:${right}px">${items.map(i=>
    `<button role="menuitem" ${i.disabled?`disabled title="${esc(i.title)}"`:`data-act="${i.act}" data-v="${esc(i.v||'')}" ${i.focus?`data-focus="${esc(i.focus)}"`:''}`}>${i.label}</button>`).join('')}</div>`;
}

/* Timeline del BOM: Sent, Approved y Rejected vienen del flujo; Delivery y SAP salen de cada entrega */
const fmtTL=d=>`${iso(d)} ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`;
/* Estados del BOM: InProgress, Sent, Approved o Rejected. Estados del ítem: Requested, Delivered y SAP */
const lastEvent=(b,st)=>[...b.events].reverse().find(e=>e.status===st);
const flowState=b=>b.events.length?b.events[b.events.length-1].status:'InProgress';
const itemState=i=>i.deliveries.length?(i.deliveries.every(d=>d.sap)?'SAP':'Delivered'):i.requestedBy?'Requested':'—';
function deliveryType(i,d){
  const done=i.deliveries.filter(x=>x.date<=d.date).reduce((sum,x)=>sum+x.qty,0);

function timelineOf(b){
  const fromItems=b.items.flatMap(i=>{
    const list=i.requestedBy?[{status:'Requested',by:i.requestedBy,at:i.requestedAt,note:`${i.code} · Requested to Stockroom`}]:[];
    i.deliveries.forEach(d=>{
      list.push({status:'Delivered',by:d.by,at:d.date,note:`${i.code} · ${deliveryType(i,d)} · ${d.qty} delivered to ${d.to} · Signed by ${d.signedBy}`});
      const log=d.sapLog||[], change=log.find(l=>!l.text), first=change?change.from:d.movement;
      if(d.sapAt) list.push({status:'SAP',by:d.sapBy,at:d.sapAt,note:`${i.code} · ${first?`SAP Movement ${first}`:'No SAP Movement yet'}`});
      log.forEach(l=>list.push({status:'SAP Modified',by:l.by,at:l.at,note:`${i.code} · ${logText(l)}`}));
    });

  });

function qr(seed){
  let s=[...seed].reduce((a,ch)=>a*31+ch.charCodeAt(0)>>>0,7), out='';
  const N=29, rnd=()=>(s=(s*1664525+1013904223)>>>0)/4294967296;
  const finder=(x,y)=>x<8&&y<8||x>N-9&&y<8||x<8&&y>N-9;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++) if(!finder(x,y)&&rnd()>.52) out+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;
  const f=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3"/>`;
  return `<svg class="qr" viewBox="0 0 ${N} ${N}" role="img" aria-label="BOM QR code" shape-rendering="crispEdges">${out}${f(0,0)}${f(N-7,0)}${f(0,N-7)}</svg>`;
}

/* Calendario de rango del reporte: primer clic marca el inicio, segundo clic marca el fin */
const REP={from:'',to:'',view:null,picking:false};
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const isoToDate=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
function reportModal(){
  REP.from=iso(new Date(NOW.getFullYear(),NOW.getMonth(),1));
  REP.to=iso(new Date(NOW.getFullYear(),NOW.getMonth()+1,0));
  REP.view=new Date(NOW.getFullYear(),NOW.getMonth(),1);

  renderCal();
}
function renderCal(){
  const v=REP.view, y=v.getFullYear(), mo=v.getMonth(), today=iso(NOW);
  const days=Math.round((isoToDate(REP.to)-isoToDate(REP.from))/86400000)+1;
  const blanks=new Date(y,mo,1).getDay(), last=new Date(y,mo+1,0).getDate();
  let cells='<span></span>'.repeat(blanks);
  for(let d=1;d<=last;d++){
    const k=iso(new Date(y,mo,d)), on=k>=REP.from&&k<=REP.to;
    cells+=`<button type="button" class="day ${on?'on':''} ${k===today?'today':''}" data-act="calDay" data-v="${k}" aria-pressed="${on}" aria-label="${MONTHS[mo]} ${d}, ${y}">${d}</button>`;
  }

    <div class="caln"><button type="button" data-act="calMove" data-v="-1" aria-label="Previous month">‹</button><b>${MONTHS[mo]} ${y}</b><button type="button" data-act="calMove" data-v="1" aria-label="Next month">›</button></div>
    <div class="calw">${['S','M','T','W','T','F','S'].map(x=>`<span>${x}</span>`).join('')}</div>
    <div class="cald">${cells}</div>`;
}
function reportRange(){
  const a=isoToDate(REP.from), b=isoToDate(REP.to);
  return {from:a,to:new Date(b.getFullYear(),b.getMonth(),b.getDate(),23,59,59,999),f:REP.from,t:REP.to};
}
const inRange=(d,r)=>d>=r.from&&d<=r.to;
const REPORT_HEAD=['Date','Created By','Description','Status','Code','Notes','Code Creation Date','Modification Request Date','Modification Requested By','Modification Status','Modified By','Modification Date','Modification Reason','What Was Modified'];
const SUMMARY_HEAD=['','Received','Approved','Rejected','Pending'];
/* En el reporte, una modificación completada se muestra como Approved */
const modStatus=m=>m.status==='Completed'?'Approved':m.status;
const modWhat=m=>m.status==='Completed'
  ?m.changes.map(x=>`${x.field}: ${x.from||'(empty)'} → ${x.to||'(empty)'}`).join('; ')
  :`Requested: ${m.details}`;
/* DECISIÓN D8 */
function reportModel(r){
  const received=codes.filter(c=>inRange(c.requestedAt,r));
  const mods=reqs.filter(m=>inRange(m.requestedAt,r)).sort((a,b)=>a.requestedAt-b.requestedAt);
  const inDetail=[...new Set([...received,...mods.map(m=>codeOf(m.codeId))])].sort((a,b)=>a.requestedAt-b.requestedAt);
  const rows=inDetail.flatMap(c=>{
    const base=[c.requestedAt,c.requestedBy,c.description,c.status,c.sapCode,c.notes,c.createdAt];
    const own=mods.filter(m=>m.codeId===c.id);
    if(!own.length) return [[...base,...Array(REPORT_HEAD.length-base.length).fill(null)]];
    /* Si hay varias modificaciones, cada una adicional va en una fila debajo, sin repetir la solicitud */
    return own.map((m,i)=>[...(i?base.map(()=>null):base),m.requestedAt,m.requestedBy,modStatus(m),m.status==='Completed'?m.completedBy:null,m.status==='Completed'?m.completedAt:null,m.reason,modWhat(m)]);
  });
  const count=(l,fn)=>l.filter(fn).length;
  return {rows,summary:[
    ['Code Requests',received.length,count(received,c=>c.createdAt),count(received,c=>c.status==='Rejected'),count(received,c=>c.status==='Pending')],
    ['Modification Requests',mods.length,count(mods,m=>m.status==='Completed'),count(mods,m=>m.status==='Rejected'),count(mods,m=>m.status==='Pending')]
  ]};
}
/* Formato del Excel: sin cuadrícula, recuadro solo en las tablas, títulos y encabezados en negrilla */
const xlSerial=d=>(d.getTime()-d.getTimezoneOffset()*60000)/86400000+25569;
const XL_LINE={style:'thin',color:{argb:'FFBFBFBF'}};
const XL_BOX={top:XL_LINE,left:XL_LINE,bottom:XL_LINE,right:XL_LINE};
const XL_WIDTHS=[23,20,34,23,12,30,22,20,20,14,20,20,40,70];
function xlHeader(cell,value){
  cell.value=value;
  cell.font={bold:true};
  cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFEEEEEE'}};
  cell.border=XL_BOX;
  cell.alignment={horizontal:'center',vertical:'middle',wrapText:true};
}
function xlBody(cell,value,align){
  if(value instanceof Date){cell.value=xlSerial(value);cell.numFmt='mm/dd/yyyy hh:mm AM/PM';}
  else if(/^[1-9]\d{0,14}$/.test(value)){cell.value=Number(value);cell.numFmt='0';}
  else if(value!==''&&value!=null) cell.value=value;
  cell.border=XL_BOX;
  cell.alignment={horizontal:align||'left',vertical:'middle',wrapText:true};
}
/* Reporte de BOM: flujo completo, con una fila por entrega. Un ítem solicitado sin entrega ocupa una fila, y un BOM sin ítems activos también */
const BOM_HEAD=['BOM','Project','BOM Status','Created By','Creation Date','Sent By','Sent Date','Approved By','Approval Date','Rejected By','Rejection Date',
  'Item Code','Description','Item Status','Requested By','Request Date','Delivered By','Delivery Date','Delivered','Delivery Type','Signed By',
  'SAP','SAP Movement','SAP Registered By','SAP Date','SAP Changes'];
const sapChanges=d=>(d.sapLog||[]).map(l=>`${logText(l)} (${l.by}, ${fmtDT(l.at)})`).join('; ');
function bomReport(r){
  const inR=d=>!!d&&inRange(d,r);
  const scope=boms.filter(b=>inR(b.createdAt)||b.events.some(e=>inR(e.at))||b.items.some(i=>inR(i.requestedAt)||i.deliveries.some(d=>inR(d.date))))
    .sort((x,y)=>x.createdAt-y.createdAt);
  const rows=scope.flatMap(b=>{
    const sent=b.events.find(e=>e.status==='Sent'), ok=lastEvent(b,'Approved'), no=lastEvent(b,'Rejected');
    const base=[b.code,b.project,flowState(b),b.createdBy,b.createdAt,sent?sent.by:'',sent?sent.at:null,ok?ok.by:'',ok?ok.at:null,no?no.by:'',no?no.at:null];
    const out=b.items.flatMap(i=>{
      const item=[i.code,i.description,itemState(i),i.requestedBy||'',i.requestedAt||null];
      const list=i.deliveries.filter(d=>inR(d.date)).sort((x,y)=>x.date-y.date);
      if(list.length) return list.map(d=>[...base,...item,d.by,d.date,d.qty,deliveryType(i,d),d.signedBy,
        d.sap?'Yes':'No',d.movement,d.sap?d.sapBy:'',d.sap?d.sapAt:null,sapChanges(d)]);
      return inR(i.requestedAt)?[[...base,...item,...Array(BOM_HEAD.length-base.length-item.length).fill(null)]]:[];
    });
    return out.length?out:[[...base,...Array(BOM_HEAD.length-base.length).fill(null)]];
  });
  const stage=st=>scope.filter(b=>b.events.some(e=>e.status===st&&inR(e.at))).length;
  const items=scope.flatMap(b=>b.items);
  const all=items.flatMap(i=>i.deliveries.filter(d=>inR(d.date)).map(d=>({i,d})));
  const inSap=all.filter(x=>x.d.sap), partial=all.filter(x=>deliveryType(x.i,x.d)==='Partial').length;
  const changes=items.flatMap(i=>i.deliveries.flatMap(d=>d.sapLog||[])).filter(l=>inR(l.at)).length;
  return {title:'BOM Report',
    summaryHead:['','BOMs Created','Sent','Approved','Rejected','Items Requested','Delivered','Partial','Total','In SAP','Not in SAP','Without SAP Movement','SAP Changes'],
    summary:[['BOM Flow',scope.filter(b=>inR(b.createdAt)).length,stage('Sent'),stage('Approved'),stage('Rejected'),items.filter(i=>inR(i.requestedAt)).length,
      all.length,partial,all.length-partial,inSap.length,all.length-inSap.length,inSap.filter(x=>!x.d.movement).length,changes]],
    head:BOM_HEAD,rows,
    widths:[14,30,12,18,20,18,20,18,20,18,20,16,44,12,18,20,14,20,11,11,16,7,15,18,20,56],
    center:[2,13,18,19,21,22]};
}
function codeReport(r){
  const m=reportModel(r);
  return {title:'Code Report',summaryHead:SUMMARY_HEAD,summary:m.summary,head:REPORT_HEAD,rows:m.rows,widths:XL_WIDTHS,center:[4,9]};
}
function buildWorkbook(r){
  const m=BOM_VIEW?bomReport(r):codeReport(r), wb=new ExcelJS.Workbook();
  const ws=wb.addWorksheet(m.title,{
    views:[{showGridLines:false}],
    pageSetup:{orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0}
  });
  ws.columns=m.widths.map(width=>({width}));
  const title=(row,text,size)=>{const c=ws.getCell(row,1);c.value=text;c.font={bold:true,size:size||12,color:{argb:'FF0D3B5C'}};};
  title(1,m.title,16);
  ws.getCell(2,1).value='Period';
  ws.getCell(2,1).font={bold:true};
  ws.getCell(2,2).value=`${fmtDate(r.from)} - ${fmtDate(r.to)}`;
  title(4,'Summary');
  m.summaryHead.forEach((h,i)=>{if(h) xlHeader(ws.getCell(5,i+1),h);});
  m.summary.forEach((s,y)=>s.forEach((v,x)=>{
    const c=ws.getCell(6+y,x+1);
    xlBody(c,v,x?'center':'left');
    if(!x) c.font={bold:true};
  }));
  const detail=7+m.summary.length, head=detail+1;
  title(detail,'Detail');
  m.head.forEach((h,i)=>xlHeader(ws.getCell(head,i+1),h));
  ws.getRow(head).height=32;
  m.rows.forEach((row,y)=>{
    row.forEach((v,x)=>xlBody(ws.getCell(head+1+y,x+1),v,m.center.includes(x)?'center':'left'));
    /* Excel no siempre ajusta el alto al abrir: se calcula según el texto más largo de la fila */
    const lines=Math.max(1,...row.map((v,x)=>typeof v==='string'?Math.ceil(v.length/(m.widths[x]*1.2)):1));
    ws.getRow(head+1+y).height=Math.max(18,lines*15+3);
  });
  ws.autoFilter={from:{row:head,column:1},to:{row:head+m.rows.length,column:m.head.length}};
  return wb;
}
async function downloadReport(){
  const r=reportRange();
  if(!r||r.from>r.to) return;
  if(!window.ExcelJS){toast('The report could not be generated. Check your internet connection.',true);return;}
  const buf=await buildWorkbook(r).xlsx.writeBuffer();
  const url=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  const a=document.createElement('a');
  a.href=url; a.download=`${BOM_VIEW?'BOM':'Code'}_Report_${r.f}_${r.t}.xlsx`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  closeModal(); toast('Report downloaded');
}

/* ---------- Eventos ---------- */
let toastT;
function toast(msg,bad){
  $('#toast').innerHTML=`<div class="toast ${bad?'bad':''}" role="status">${esc(msg)}</div>`;
  clearTimeout(toastT); toastT=setTimeout(()=>{$('#toast').innerHTML='';},3600);
}
const actions={
  tab(v){S.tab=v;S.bom=null;S.statusMenu=false;render();},
  sort(){S.sortAsc=!S.sortAsc;render();},
  statusMenu(){S.statusMenu=!S.statusMenu;render();},
  statusPick(v){S.statusFilter=v;S.statusMenu=false;render();},
  modFilter(v){S.modFilter=v;render();},
  report(){reportModal();},
  itemRequest(v){const [b,n]=v.split('|'),i=boms.find(x=>x.id===b).items.find(x=>x.index==n);i.requestedBy=S.user.name;i.requestedAt=new Date();render();toast('Item requested to Stockroom');},
  timeline(v){timelineModal(boms.find(b=>b.id===v));},
  rowMenu(v,el){rowMenu(v,el);},
  view(v){viewModal(codeOf(v));},
  existing(){closeModal();toast('This action already exists in Project Agenda. It is not part of this mockup.');},
  calMove(v){REP.view=new Date(REP.view.getFullYear(),REP.view.getMonth()+Number(v),1);renderCal();},
  calDay(v){
    if(!REP.picking){REP.from=REP.to=v;REP.picking=true;}
    else{if(v<REP.from){REP.to=REP.from;REP.from=v;}else REP.to=v;REP.picking=false;}
    renderCal();
  },
  request(v){requestModal(codeOf(v));},
  history(v,el){historyModal(codeOf(v),el.dataset.focus);},
  edit(v){if(S.user.canEdit)editModal(reqOf(v));},
  reject(v){if(S.user.canEdit)rejectModal(reqOf(v));},
  modalClose(){closeModal();},
  bom(v){S.bom=v;render();window.scrollTo(0,0);},
  bomClose(){S.bom=null;render();},
  movEdit(v){delivery(v).editing=true;render();const i=$(`[data-mov="${v}"]`);if(i){i.focus();i.select();}}
};
document.addEventListener('click',e=>{
  /* Un clic fuera cierra el calendario o el menú; otro clic en su botón también los cierra */
  const open=$('.pop,.rowmenu');
  if(open&&!e.target.closest('.pop,.rowmenu')){
    const again=open.matches('.pop')?e.target.closest('[data-act=report]'):e.target.closest(`[data-act=rowMenu][data-v="${open.dataset.for}"]`);
    closeModal();
    if(again) return;
  }
  if(e.target.matches('[data-ov]')){closeModal();return;}
  const el=e.target.closest('[data-act]');
  if(el){actions[el.dataset.act](el.dataset.v,el);return;}
  if(S.statusMenu){S.statusMenu=false;render();}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#modal').innerHTML) closeModal();
  if(e.key==='Enter'&&e.target.matches('[data-mov]')) e.target.blur();
  if(e.key==='Enter'&&e.target.matches('tr[data-act]')) e.target.click();
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  const f=e.target;
  if(f.id==='fReq') submitRequest(f);
  if(f.id==='fEdit') saveEdit(f);
  if(f.id==='fRej') saveReject(f);
  if(f.id==='fRep') downloadReport();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.matches('[data-f]')) refreshDiff();
  if(t.matches('[data-mov]')) t.value=t.value.replace(/\D/g,'');
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='viewAs'){S.user=USERS.find(u=>u.id===t.value);render();return;}
  if(t.matches('[data-mov]')){
    const d=delivery(t.dataset.mov);
    const prev=d.movement;
    if(d.sap&&prev&&!t.value){ d.editing=false; render(); toast('The SAP Movement is required',true); return; }
    d.movement=t.value; d.err=false;
    /* Solo se vuelve a pintar si la entrega ya está marcada, para no perder el clic en el check */
    if(d.sap){
      /* Cada cambio queda registrado para el timeline */
      if(d.movement!==prev) (d.sapLog=d.sapLog||[]).push({by:S.user.name,at:new Date(),from:prev,to:d.movement});
      d.editing=false; if(d.movement) toast('SAP Movement saved'); render();
    }
    return;
  }
  if(t.matches('[data-sap]')){
    const d=delivery(t.dataset.sap);
    if(t.checked&&!d.movement){ d.err=true; render(); return; }
    /* La primera marcación queda como evento SAP; quitarla o volver a marcarla queda como cambio */
    if(t.checked&&!d.sapAt){ d.sapBy=S.user.name; d.sapAt=new Date(); }
    else (d.sapLog=d.sapLog||[]).push({by:S.user.name,at:new Date(),text:t.checked?'SAP mark restored':'SAP mark removed'});
    d.sap=t.checked; d.err=false; d.editing=false;
    render();
  }
});
render();
</script>
